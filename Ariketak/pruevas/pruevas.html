<!--Te han encargado hacer una página web en tu empresa para la Asociación Deportiva de tu barrio.

Crea una página HTML donde, al pulsar un botón, se inicie tu programa en JavaScript. Puedes darle al usuario la opción de elegir qué función ejecutar haciendo una selección en el programa, o bien colocar cuatro botones en la página HTML, donde cada uno ejecute una función distinta.

Calculadora de IMC – Índice de Masa Corporal – (imc.js)
Crea un programa que solicite al usuario su altura en centímetros y su peso en kilogramos, y que devuelva el índice de masa corporal mostrado en la pantalla (en el cuerpo de la página).

Además de mostrar el resultado, se mostrará esta escala y se marcará de alguna manera la clasificación correspondiente (negrita, subrayado, resaltado en color...):

< 16.00: Peso inferior al normal (delgadez severa)
16.00 – 16.99: Peso inferior al normal (delgadez moderada)
17.00 - 18.49: Peso inferior al normal (delgadez aceptable)
18.50 - 24.99: Peso normal
25.00 - 29.99: Sobrepeso
30.00 - 34.99: Obesidad (tipo I)
35.00 - 40.00: Obesidad (tipo II)
> 40.00: Obesidad (tipo III)
Además, verificará que no se han introducido valores incorrectos para el peso y la altura y, en ese caso, solicitará los datos nuevamente.

Calculadora de FCM – Frecuencia Cardíaca Máxima – (fcm.js)
Crea un programa que solicite al usuario su edad y sexo, y que devuelva la frecuencia cardíaca máxima en pantalla (en el cuerpo de la página).

Además, mostrará los siguientes valores:

Zona de recuperación (% 60-70).
Zona aeróbica (% 70-80).
Zona anaeróbica (% 80-90).
Línea roja (% 90-100).
También verificará que no se han introducido valores incorrectos para la edad y el sexo, y, en ese caso, solicitará los datos nuevamente.

Calculadora de categoría (categoria.js)
Crea un programa que solicite al usuario su año de nacimiento y que devuelva la categoría correspondiente.
Para ello, además de mostrar el resultado, mostrará una lista de categorías existentes (desde Micros hasta Senior), marcando de manera especial la correspondiente al usuario (negrita, subrayado, resaltado en color...).

Horario de la asociación (horarios.js)
Crea un programa que genere dos tablas HTML con los horarios de la asociación.

Habrá una tabla para el horario de mañana, en formato 9:00-11:00, desde las 9:00 hasta las 15:00, de lunes a viernes.

Habrá otra tabla para el horario de tarde, en formato 16:00-17:00, desde las 16:00 hasta las 21:00, y se mostrarán los días desde lunes a domingo, uno a uno.

Tanto las horas como los días (es decir, la primera columna y la primera fila) tendrán la etiqueta th. El resto tendrán la etiqueta td.

-->
